<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stufen Flashcards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: deck rail on the left, one deck's workspace on the right (Study / Cards / Card types / Schedule). */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e7ecea; --ink:#16201e; --muted:#5a6966; --line:#d3dad8;
  --accent:#0c6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee;
  --wrong:#b23b2a; --hard:#96650a; --good:#27733a; --easy:#2a5fb0;
  --a0:#b23b2a; --a1:#e8a08f; --a2:#9ec5f4; --a3:#3987e5; --a4:#184f95;
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1514; --surface:#182120; --sunk:#111918; --ink:#e4ebe9; --muted:#93a29f; --line:#2b3836;
  --accent:#56c2ba; --accent-ink:#06211f; --accent-soft:#17373a;
  --wrong:#ef8272; --hard:#e0ad4a; --good:#6fca84; --easy:#7fb0f2;
  --a0:#f08a7a; --a1:#96524a; --a2:#1c5cab; --a3:#3987e5; --a4:#b7d3f6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#182120; --sunk:#111918; --ink:#e4ebe9; --muted:#93a29f; --line:#2b3836;
  --accent:#56c2ba; --accent-ink:#06211f; --accent-soft:#17373a;
  --wrong:#ef8272; --hard:#e0ad4a; --good:#6fca84; --easy:#7fb0f2;
  --a0:#f08a7a; --a1:#96524a; --a2:#1c5cab; --a3:#3987e5; --a4:#b7d3f6; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body)}
#app{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:14px 48px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font:700 22px/1 var(--f-display);letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--accent)}
.tag{color:var(--muted);font-size:13px}
#status{margin-left:auto;font:400 12px var(--f-mono);color:var(--muted)}
#status.err{color:var(--wrong)}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;margin-top:20px}
#side{display:flex;flex-direction:column;gap:6px;align-content:start}
.side-h{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.deck{display:flex;align-items:center;gap:6px;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;color:var(--ink);font:inherit;cursor:pointer}
.deck:hover{background:var(--sunk)}
.deck.cur{background:var(--surface);border-color:var(--line);font-weight:600}
.deck .dn{flex:1;min-width:0;overflow-wrap:anywhere}
.b{font:500 11px var(--f-mono);padding:1px 6px;border-radius:9px;font-variant-numeric:tabular-nums}
.b.due{background:var(--accent);color:var(--accent-ink)}
.b.new{background:var(--sunk);color:var(--muted)}
.legend{font-size:12px;color:var(--muted);margin-top:4px}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#deck-name{flex:1;min-width:180px;font:700 26px/1.2 var(--f-display);border:0;border-bottom:1px solid transparent;background:none;color:var(--ink);padding:2px 0}
#deck-name:hover,#deck-name:focus{border-bottom-color:var(--line);outline:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font:700 18px/1.3 var(--f-display);margin:0;text-wrap:balance}
h3{font:600 14px/1.3 var(--f-body);margin:0}
p{margin:0;max-width:68ch}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{font:500 13px var(--f-body);padding:7px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--wrong);border-color:var(--wrong)}
.btn.big{padding:12px 22px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{font:400 13px/1.45 var(--f-mono);width:100%;min-height:64px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.inline{flex-direction:row;align-items:center;gap:8px}
input[type=number]{width:72px}
kbd{font:400 11px var(--f-mono);border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7;margin-left:6px}
.msrev{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msrev-l{max-height:min(46vh,340px);overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.msrev-l label{padding:3px 2px;align-items:baseline}
.banner{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:13px}
.empty{padding:40px 0;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* study overview */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat b{display:block;font:500 24px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--accent)}
.dist{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-top:4px}
.col{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px;font:400 11px var(--f-mono);color:var(--muted)}
.col .bar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.col.new .bar{background:var(--muted)} .col.done .bar{background:var(--good)}
.col .n{color:var(--ink);font-variant-numeric:tabular-nums}
.barbox{height:70px;width:100%;display:flex;align-items:flex-end}

/* study card */
.study{display:flex;flex-direction:column;gap:14px;align-items:stretch;max-width:760px}
.cardbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 22px;min-height:230px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.tname{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
#typed{align-self:center;width:min(320px,100%);text-align:center;font:500 18px var(--f-mono)}
.verdict{text-align:center;font:500 14px var(--f-mono)}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--wrong)}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.g{display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font:600 14px var(--f-body)}
.g small{font:400 12px var(--f-mono);color:var(--muted)}
.g-none{color:var(--wrong)} .g-close{color:var(--hard)} .g-hard{color:var(--accent)} .g-easy{color:var(--good)} .g-brainer{color:var(--easy)}
.g:hover{border-color:currentColor}
.verdict.mid{color:var(--hard)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:500 16px var(--f-body);cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt img{max-width:100%;max-height:150px;border-radius:4px;display:block}
.opt small{font:400 11px var(--f-mono);color:var(--muted)}
.opt.k-right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.opt.k-close{border-color:var(--hard);border-style:dashed}
.opt.picked.k-close{border-style:solid;box-shadow:inset 0 0 0 1px var(--hard)}
.opt.picked.k-wrong{border-color:var(--wrong);box-shadow:inset 0 0 0 1px var(--wrong)}
.oe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.oe>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumb{position:relative;border:1px solid var(--line);border-radius:6px;padding:3px;display:flex;align-items:flex-start}
.thumb img{height:64px;max-width:120px;object-fit:cover;border-radius:4px;display:block}
@media (max-width:640px){ .oe{grid-template-columns:minmax(0,1fr)} }
#clickmap.live .rmap,#edmap .rmap{cursor:crosshair} #clickmap .rmap{--mh:max(320px,calc(100vh - 480px))} #edmap .rmap{--mh:66vh}
.rmap.pan{cursor:grabbing!important} #clickmap.live .pb:hover{fill:var(--accent-soft)} #clickmap.live .gm .pb:hover{fill:var(--g-hover)} .study.wide{max-width:1040px}
/* statistics */
.a0{background:var(--a0)} .a1{background:var(--a1)} .a2{background:var(--a2)} .a3{background:var(--a3)} .a4{background:var(--a4)} .due{background:var(--accent)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legendrow{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.chart{display:flex;gap:8px;min-width:0}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:150px;font:400 11px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.plot{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));column-gap:2px;background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 75px/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 149px/100% 1px no-repeat}
.colw{display:flex;flex-direction:column;align-items:center;min-width:0;outline-offset:2px}
.colbar{width:100%;max-width:24px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.colbar i{display:block;width:100%} .colbar i:last-child{border-radius:4px 4px 0 0}
.colw:hover .colbar,.colw:focus-visible .colbar{filter:brightness(1.12)}
.xl{font:400 10px var(--f-mono);color:var(--muted);white-space:nowrap;height:16px;margin-top:4px}
.colw.mark .xl{color:var(--ink)}
.srow{display:grid;grid-template-columns:minmax(110px,220px) minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:13px;padding:3px 0}
.sbar{display:flex;gap:2px;height:16px} .sbar i{display:block;min-width:2px} .sbar i:first-child{border-radius:3px 0 0 3px} .sbar i:last-child{border-radius:0 3px 3px 0}
.sv{font:400 12px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums} .sv b{color:var(--ink);font-weight:500}
.sl{overflow-wrap:anywhere}
.hm{fill:var(--wrong);stroke:var(--wrong);stroke-width:.6;stroke-opacity:.5}
.ramp{display:inline-flex;gap:2px} .ramp i{display:block;width:22px;height:10px;background:var(--wrong);border-radius:2px}
#statmap .rmap{--mh:62vh}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);font:400 12px/1.45 var(--f-body);padding:7px 9px;border-radius:6px;white-space:pre-line;max-width:260px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.tip::first-line{font-weight:600}
@media (max-width:640px){ .srow{grid-template-columns:minmax(0,1fr) 110px} .srow .sbar{grid-column:1 / -1;grid-row:2} }
.pagetitle{flex:1;font:700 26px/1.2 var(--f-display);margin:0}
#open-settings.on,#open-home.on{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.mapbox{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-height:0}
.mhead,.mfoot{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:901px){
  .study.tall{max-width:none}
  .study.tall .mapbox{grid-template-columns:minmax(0,1fr) minmax(230px,300px);grid-template-rows:auto 1fr;align-items:start;column-gap:22px}
  .study.tall #clickmap{grid-column:1;grid-row:1 / span 2}
  .study.tall .mhead{grid-column:2;grid-row:1;padding-top:10px}
  .study.tall .mfoot{grid-column:2;grid-row:2}
  .study.tall .mfoot .grades{grid-template-columns:minmax(0,1fr);gap:6px;order:2}
  .study.tall .mfoot .verdict,.study.tall .mfoot .glinks{order:1} .study.tall .mfoot #face2{order:3}
  .study.tall .mfoot .glinks{justify-content:flex-start}
  .study.tall .mfoot .g{flex-direction:row;justify-content:flex-start;gap:8px;padding:8px 12px}
  .study.tall .mfoot .g small{margin-left:auto}
  .study.tall #clickmap .rmap{--mh:max(380px,calc(100vh - 292px))}
}
.geoprev{border:1px solid var(--line);border-radius:6px;background:var(--sunk);display:block;width:100%;max-height:300px}
.geoprev path{fill:var(--surface);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
#modal,#modal2,#modal3{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow:auto;z-index:10}
.sheet{background:var(--surface);color:var(--ink);border-radius:10px;padding:18px;max-width:1000px;width:100%;display:flex;flex-direction:column;gap:12px}

/* cards table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;min-width:100%}
th:first-child,td:first-child{width:30px;text-align:center}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{background:var(--sunk);font-weight:500;font-size:12px}
th .fh{display:flex;gap:4px;align-items:center}
th input{border-color:transparent;background:none;font-weight:600;font-size:13px;min-width:90px;width:100%}
th input:hover,th input:focus{border-color:var(--line);background:var(--surface)}
td input[data-f]{border-color:transparent;width:100%;min-width:190px;border-radius:4px}
td input[data-f]:hover{border-color:var(--line)}
td.num{font:400 11px var(--f-mono);color:var(--muted);width:34px;text-align:right}
td.prog{font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap}
tr.ghost td{background:var(--sunk)}
tr.ghost input{background:none}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;border-radius:4px}
.x:hover{color:var(--wrong)}
.imgbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px dashed var(--line);border-radius:4px;padding:3px 8px;color:var(--muted);cursor:pointer;font-size:12px}
.imgbtn img{height:34px;max-width:70px;object-fit:cover;border-radius:3px;display:block}
.imgbtn.has{border-style:solid;padding:2px}

/* card types */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tgrid>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.prev{border:1px dashed var(--line);border-radius:8px;padding:16px;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{font:400 12px var(--f-mono);border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:4px;padding:2px 6px;cursor:pointer}

/* schedule */
.stages{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.stage{display:flex;flex-direction:column;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.stage .sth{width:100%;display:flex;align-items:center;min-height:20px}
.rn,.rc,.cl{font:400 10px var(--f-mono);color:var(--muted)}
.clock{display:flex;align-items:center;gap:2px}
.cu{display:flex;flex-direction:column;align-items:center;gap:1px}
.cu.off{opacity:.3}
.ca{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;padding:4px 9px;border-radius:4px}
.ca:hover:not(:disabled){color:var(--accent);background:var(--sunk)}
.cv{width:3.3ch;box-sizing:content-box;text-align:center;font:500 22px/1 var(--f-mono);padding:5px 2px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-variant-numeric:tabular-nums}
.colon{font:500 22px/1 var(--f-mono);color:var(--muted);padding-bottom:12px}
.stage select{font-size:12px;padding:3px 4px}
.endbox{align-self:center;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;display:flex;align-items:center;font:400 12px var(--f-mono);color:var(--muted)}
.rules{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.wide{width:100%}
.errt{color:var(--wrong);font-size:12px}
.clname{font:600 16px var(--f-body);min-width:160px}

.dlist{display:flex;flex-direction:column;gap:6px} .dtog{display:none}
#deck-q{width:100%;font-size:13px}
.librow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.librow:hover{border-color:var(--muted)} .librow .grow{overflow-wrap:anywhere} .tw{color:var(--muted);font-size:13px}
.brand{cursor:pointer}
.gh{display:flex;align-items:center;gap:6px;text-align:left;padding:8px 10px 2px;border:0;background:none;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-radius:6px}
.gh2{padding-left:22px;text-transform:none;letter-spacing:0;font:500 13px var(--f-body)} .in2{display:flex;flex-direction:column;padding-left:14px} .in2:empty{display:none}
tr.fold td{background:var(--sunk)} tr.fold.f2 td{background:none} tr.fold .foldbtn{background:none;border:0;padding:0;font:600 15px var(--f-body);color:var(--ink);cursor:pointer;text-align:left} tr.fold.f2 .foldbtn{font-weight:500;padding-left:18px}
tr.fold .foldbtn:hover{color:var(--accent)} table.home td.ind1{padding-left:28px} table.home td.ind2{padding-left:46px} .fo-in{width:170px}
.gh:hover{color:var(--ink)} .gh .dn{flex:1;min-width:0;overflow-wrap:anywhere}
.home td,.home th{padding:7px 10px;width:auto!important;text-align:left!important;font-size:14px}

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 10).padEnd(8, '0');
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- durations and the scheduler (pure) ---------- */
const UNIT = {m:1, min:1, h:60, d:1440, w:10080, mo:43200, y:525600};
/* three kinds of wait: 'q' = behind everything due right now, 'h' = exact minutes/hours, 'd' = whole days (due at day start) */
function parseDur(t){
  if(/^\s*(end|queue|q)\s*$/i.test(t)) return {min: 0, kind: 'q'};
  const m = /^\s*(\d+(?:[.,]\d+)?)\s*(min|mo|m|h|d|w|y)?\s*$/i.exec(t);
  if(!m) return null;
  const u = (m[2] || 'd').toLowerCase(), r = Math.round(parseFloat(m[1].replace(',', '.')) * UNIT[u]);
  return r > 0 ? {min: r, kind: u === 'm' || u === 'min' || u === 'h' ? 'h' : 'd'} : null;
}
function parseStages(text){
  const stages = [], kinds = [], bad = [];
  for(const tok of String(text).split(/[,;\n]+/)){ if(!tok.trim()) continue; const v = parseDur(tok); if(v){ stages.push(v.min); kinds.push(v.kind); } else bad.push(tok.trim()); }
  return {stages, kinds, bad};
}
function fmtDur(min, kind){
  const r = x => String(Math.round(x * 10) / 10);
  if(!min) return 'queue';
  if(min < 60) return r(min) + 'm';
  if(min < 1440 || kind === 'h') return r(min / 60) + 'h';
  const d = min / 1440;
  if(d < 100) return r(d) + 'd';
  if(d < 730) return r(d / 30) + 'mo';
  return r(d / 365) + 'y';
}
function dayStart(now, roll){ const d = new Date(now); if(d.getHours() < roll) d.setDate(d.getDate() - 1); d.setHours(roll, 0, 0, 0); return d.getTime(); }
function dueAt(now, iv, kind, roll){
  const t = now + iv * 60000;
  return kind === 'd' ? dayStart(t, roll) : t;   // 'q' has iv 0: due now, so it sorts behind every card that was already due
}
const GR = [['none', 'No idea'], ['close', 'Wrong but close'], ['hard', 'Right but hard'], ['easy', 'Easy'], ['brainer', 'No brainer']];
const MOVES0 = {none: 'reset', close: -1, hard: 0, easy: 1, brainer: 2};
/* what the answer check found -> which buttons may be pressed */
const allowed = res => res === 'right' ? ['hard', 'easy', 'brainer'] : res === 'close' ? ['close'] : res === 'far' ? ['none', 'close'] : res === 'none' ? ['none'] : GR.map(g => g[0]);
/* state: {st: index of the stage the card is waiting on, iv, due, reps, lapses, first, last, done} */
function schedule(s, grade, cl, now, roll){
  const n = cl.stages.length;
  const st0 = s && s.st != null ? Math.min(s.st, n - 1) : -1;
  const o = {reps: (s && s.reps || 0) + 1, lapses: s && s.lapses || 0, first: s && s.first || now, last: now, done: false};
  const mv = cl.moves[grade];
  if(grade === 'none' || grade === 'close') o.lapses++;
  let st = mv === 'reset' ? 0 : Math.max(0, st0 + mv), iv;
  if(st > n - 1){
    st = n - 1;
    if(st0 === n - 1 && cl.end === 'retire'){ o.done = true; iv = null; }
    else if(st0 === n - 1 && cl.end === 'grow') iv = Math.round((s && s.iv || cl.stages[n - 1]) * (cl.grow || 2));
    else iv = cl.stages[n - 1];
  } else iv = st === st0 && st === n - 1 && s && s.iv ? s.iv : cl.stages[st];
  o.st = st; o.iv = iv; o.due = o.done ? null : dueAt(now, iv, cl.kinds[st], roll);
  if(!o.done && cl.kinds[st] === 'q') o.q = true;
  return o;
}

/* ---------- state ---------- */
const S = {
  decks: {}, notes: {}, cur: null, tab: 'study', loading: true, err: '', confirm: null,
  study: {on: false, cluster: '', shown: false, cur: null, typed: null, click: null, res: null, dist: 0, opts: null, pick: null, rview: null, hit: '', early: false, undo: null, last: null, extra: 0, soon: null, timer: 0},
  cards: {q: '', cluster: '', page: 0, sel: new Set(), imp: false, msg: ''},
  lastTA: null, imgTarget: null, ed: null, imp: null, oe: null,
  lib: [], view: 'deck', setMsg: '', ticks: new Set(), pick: null,
  logs: {}, stat: {range: 30},
  meta: {snaps: [], groups: [], folders: {}}, fo: {a: '', b: ''}, libOpen: new Set(), homeSel: new Set(), homeMsg: '', sideQ: '', ce: null, busy: '', usage: null, vac: {n: 7, dir: 1, deck: ''}
};
let db = null, assets = null, downloads = null;
const PAGE = 100;

function mkCluster(name, from){
  const st = from ? from.stages.slice() : [10, 1440, 4320, 10080, 23040, 50400, 129600, 259200];
  return {id: uid(), name, stages: st, kinds: from ? from.kinds.slice() : st.map(m => m >= 1440 ? 'd' : 'h'), moves: {...MOVES0}, end: 'repeat', grow: 2};
}
function mkDeck(name){
  return {id: uid(), name, created: Date.now(), newPerDay: 20, rollover: 4, css: '',
    fields: [{id: uid(), name: 'Front', kind: 'text'}, {id: uid(), name: 'Back', kind: 'text'}],
    types: [{id: uid(), name: 'Front → Back', front: '{{Front}}', back: '{{Back}}', typed: ''}],
    clusters: [mkCluster('Default')]};
}
function normDeck(d){
  d.fields = d.fields || []; d.types = d.types || []; d.css = d.css || '';
  if(d.newPerDay == null) d.newPerDay = 20; if(d.rollover == null) d.rollover = 4;
  if(!d.clusters || !d.clusters.length) d.clusters = [mkCluster('Default')];
  for(const c of d.clusters){
    if(!(Array.isArray(c.kinds) && Array.isArray(c.stages) && c.stages.length && c.kinds.length === c.stages.length)){
      const p = parseStages(c.text || '');
      if(p.stages.length && !p.bad.length){ c.stages = p.stages; c.kinds = p.kinds; } else { c.stages = c.stages && c.stages.length ? c.stages : [1440]; c.kinds = c.stages.map(m => m >= 1440 ? 'd' : 'h'); }
    }
    delete c.text;
    if(!c.moves) c.moves = {none: c.again === 'back' ? -(c.back || 1) : c.again === 'stay' ? 0 : 'reset', close: -1, hard: 0, easy: 1, brainer: 1 + (c.easy || 1)};
    delete c.again; delete c.back; delete c.easy;
  }
  delete d.buttons;
  return d;
}
const deckPath = d => 'decks/' + d.id;
const notePath = (d, n) => 'decks/' + d.id + '/notes/' + n.id;
const notesOf = d => S.notes[d.id] || (S.notes[d.id] = new Map());
const sortedNotes = d => [...notesOf(d).values()].sort((a, b) => (a.o || 0) - (b.o || 0));
const clusterOf = (d, n) => d.clusters.find(c => c.id === n.c) || d.clusters[0];
function mkNote(d, clusterId){
  let max = 0; for(const n of notesOf(d).values()) if((n.o || 0) > max) max = n.o;
  const n = {id: uid(), c: clusterId || d.clusters[0].id, f: {}, s: {}, o: max + 1, t: Date.now()};
  notesOf(d).set(n.id, n); return n;
}

/* per-card marks, kept beside the progress: n.x[card type] = {s: 1 suspended, f: 1 flagged, b: buried until this time} */
const NOX = {};
const markOf = (n, tid) => (n.x && n.x[tid]) || NOX;
function setMark(n, tid, k, v){
  n.x = n.x || {}; const m = n.x[tid] || (n.x[tid] = {});
  if(v) m[k] = v; else delete m[k];
  if(!Object.keys(m).length) delete n.x[tid]; if(!Object.keys(n.x).length) delete n.x;
}
const isOff = (n, tid, now) => { const m = markOf(n, tid); return !!m.s || m.b > now; };
const nextDay = (now, roll) => dayStart(dayStart(now, roll) + 36 * 3600000, roll);
const hash = s => { let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const natCmp = new Intl.Collator(undefined, {numeric: true, sensitivity: 'base'}).compare;
/* new cards for the study day `now` falls in: one number, or one per weekday (Monday first) */
const newLimit = (d, now) => { const a = d.newByDay; if(!Array.isArray(a) || a.length !== 7) return d.newPerDay; const v = a[(new Date(dayStart(now, d.rollover)).getDay() + 6) % 7]; return v == null ? d.newPerDay : v; };
const allDecks = () => Object.values(S.decks).sort((a, b) => (a.created || 0) - (b.created || 0));
/* the order new cards come in: as listed (null), a fixed shuffle, or sorted by a text column */
function newBefore(d){
  const o = d.newOrder || 'list';
  if(o === 'random'){ const sd = String(d.seed || ''); return (a, b) => hash(sd + a.n.id + a.t.id) - hash(sd + b.n.id + b.t.id); }
  const m = /^(col|cod):(.+)$/.exec(o), f = m && d.fields.find(x => x.id === m[2] && x.kind === 'text');
  if(f){ const dir = m[1] === 'cod' ? -1 : 1; return (a, b) => dir * natCmp(String(a.n.f[f.id] || ''), String(b.n.f[f.id] || '')); }
  return null;
}

/* ---------- storage: one write at a time per document, a limited number in flight ---------- */
const pend = new Map(), flying = new Set(), timers = new Map(), waitq = [];
const WRITERS = (window.claude && window.claude.writers) || 4;   // on the own site, writes that come together are sent as one request
let active = 0;
function save(path, obj){
  pend.set(path, obj); stateV++; planC = null; touch(path); setStatus();
  clearTimeout(timers.get(path));
  timers.set(path, setTimeout(() => { timers.delete(path); if(!flying.has(path) && !waitq.includes(path)){ waitq.push(path); pump(); } }, 400));
}
function pump(){
  while(active < WRITERS && waitq.length){ const p = waitq.shift(); active++; run(p).finally(() => { active--; setStatus(); pump(); }); }
}
async function run(path){
  flying.add(path);
  try{
    while(pend.has(path)){
      const o = pend.get(path); pend.delete(path);
      if(!db) continue;
      const body = o === null ? null : clone(o);
      for(let tries = 0;;){
        try{ const ref = db.doc(path); if(body === null) await ref.delete(); else await ref.set(body); S.err = ''; break; }
        catch(e){
          const code = e && e.code;
          if((code === 'unavailable' || code === 'resource_exhausted') && tries < 6){ tries++; await sleep(500 * 2 ** tries + Math.random() * 400); continue; }
          S.err = code === 'quota_exceeded' ? 'Storage is full. Delete some cards, then edit again.' :
                  code === 'invalid_argument' ? 'A change was refused (the card may be too large, or this view is read-only).' :
                  'Could not save. Reload the page and try again.';
          break;
        }
      }
    }
  } finally { flying.delete(path); }
}
function setStatus(){
  const el = $('#status'); if(!el) return;
  el.classList.toggle('err', !!S.err);
  el.textContent = S.loading ? 'Loading…' : S.err ? S.err : S.busy ? S.busy : S.syncing ? 'Checking for changes…' : !db ? 'This view does not save' : (pend.size || flying.size) ? 'Saving…' : S.syncNote && Date.now() - S.syncNote < 6000 ? 'Updated from another device' : 'Saved';
}
const saveDeck = d => save(deckPath(d), d);
const saveNote = (d, n) => save(notePath(d, n), n);
const saveMeta = () => save('meta/settings', S.meta);
/* resolves once nothing is waiting to be written to this document */
async function idle(path){ for(let i = 0; i < 300 && (pend.has(path) || flying.has(path) || waitq.includes(path) || timers.has(path)); i++) await sleep(100); }

/* everything stored under one deck: its rows and its answer log */
async function fetchDeck(d){
  const notes = new Map(), logs = new Map(); let last = null;
  for(;;){
    let q = db.collection('decks/' + d.id + '/notes'); if(last) q = q.where('id', '>', last);
    const s = await q.limit(1000).get();
    for(const doc of s.docs){ const n = clone(doc.data()); n.id = doc.id; n.f = n.f || {}; n.s = n.s || {}; notes.set(n.id, n); }
    if(s.size < 1000) break; last = s.docs[s.size - 1].id;
  }
  last = null;   // the review log; a failure here must not block the decks
  try{ for(;;){ let q = db.collection('decks/' + d.id + '/log'); if(last) q = q.where('id', '>', last); const s = await q.limit(1000).get();
    for(const doc of s.docs){ const x = doc.data(); if(x && Array.isArray(x.e)) logs.set(doc.id, {id: doc.id, e: x.e.filter(v => typeof v === 'string')}); }
    if(s.size < 1000) break; last = s.docs[s.size - 1].id; } }catch(e){}
  return {notes, logs};
}
function applyMeta(m){
  S.meta = Object.assign({snaps: [], groups: []}, clone(m));
  S.meta.snaps = (Array.isArray(S.meta.snaps) ? S.meta.snaps : []).filter(x => x && x.id && Array.isArray(x.ids));
  S.meta.groups = (Array.isArray(S.meta.groups) ? S.meta.groups : []).filter(g => g && g.id && Array.isArray(g.decks)).map(g => ({id: String(g.id), name: String(g.name || 'Group'), decks: g.decks.filter(x => typeof x === 'string')}));
  const fo = {}; if(S.meta.folders && typeof S.meta.folders === 'object') for(const [k, v] of Object.entries(S.meta.folders)) if(Array.isArray(v) && String(v[0] || '').trim()) fo[k] = [String(v[0]).trim(), String(v[1] || '').trim()];
  S.meta.folders = fo;
}
async function loadMeta(){
  if(!busyPath('meta/settings')){ try{ const s = await db.doc('meta/settings').get(), m = s && s.exists && s.data(); if(m && typeof m === 'object') applyMeta(m); }catch(e){} }
  if(!busyPath('meta/schedules')){ try{ const snap = await db.doc('meta/schedules').get(), l = snap && snap.exists && snap.data().list; if(Array.isArray(l)) S.lib = l.filter(x => x && typeof x === 'object' && x.id).map(x => normLadder(clone(x))); }catch(e){} }
}
async function loadAll(){
  try{ const ps = await db.doc('meta/pulse').get(), pd = ps && ps.exists && ps.data(); if(pd){ if(pd.decks && typeof pd.decks === 'object') Object.assign(seen.decks, pd.decks); if(typeof pd.meta === 'string') seen.meta = pd.meta; } }catch(e){}   // stamps read before the data: whatever changes later is noticed
  const snap = await db.collection('decks').get();
  for(const doc of snap.docs){ const d = clone(doc.data()); d.id = doc.id; S.decks[d.id] = normDeck(d); }
  await Promise.all(Object.values(S.decks).map(async d => { const r = await fetchDeck(d); S.notes[d.id] = r.notes; S.logs[d.id] = r.logs; }));
  await loadMeta();
}

/* ---------- two devices ----------
   Writes are last-writer-wins on whole documents, so a page working on old data would overwrite what another device did.
   Every change therefore leaves a stamp per deck in meta/pulse (merged, never replaced). A page that sees a stamp it did not
   write re-reads just that deck. It watches the pulse live and asks again whenever it comes back to the foreground. */
const TAB = uid(), seen = {decks: {}, meta: ''};
let pulseDirty = null, pulseTimer = 0, syncQ = Promise.resolve(), lastCheck = Date.now(), hiddenAt = 0;
const busyPath = p => pend.has(p) || flying.has(p) || timers.has(p) || waitq.includes(p);
function touch(path){
  if(path === 'meta/pulse') return; pulseDirty = pulseDirty || {decks: new Set(), meta: false};
  const m = /^decks\/([^/]+)/.exec(path); if(m) pulseDirty.decks.add(m[1]); else pulseDirty.meta = true;
  clearTimeout(pulseTimer); pulseTimer = setTimeout(sendPulse, 1200);
}
async function sendPulse(){
  if(!db || !pulseDirty) return;
  if(pend.size || flying.size || waitq.length){ clearTimeout(pulseTimer); pulseTimer = setTimeout(sendPulse, 400); return; }   // the stamp goes out only after the changes themselves are stored
  const dty = pulseDirty, v = Date.now() + '.' + TAB, body = {t: Date.now(), decks: {}}; pulseDirty = null;
  for(const id of dty.decks){ body.decks[id] = v; seen.decks[id] = v; } if(dty.meta){ body.meta = v; seen.meta = v; }
  try{ await db.doc('meta/pulse').update(body); }
  catch(e){ if(e && e.code === 'invalid_argument'){ try{ await db.doc('meta/pulse').set(body); }catch(e2){} } else { pulseDirty = pulseDirty || {decks: new Set(), meta: false}; for(const id of dty.decks) pulseDirty.decks.add(id); if(dty.meta) pulseDirty.meta = true; clearTimeout(pulseTimer); pulseTimer = setTimeout(sendPulse, 5000); } }
}
function onPulse(p){
  if(!p || typeof p !== 'object') return; const ids = [], dk = p.decks && typeof p.decks === 'object' ? p.decks : {}; let meta = false;
  for(const id in dk){ const v = dk[id]; if(typeof v !== 'string' || seen.decks[id] === v) continue; seen.decks[id] = v; if(!v.endsWith('.' + TAB)) ids.push(id); }
  if(typeof p.meta === 'string' && p.meta !== seen.meta){ seen.meta = p.meta; meta = !p.meta.endsWith('.' + TAB); }

/* ---------- review log: one document per deck and study day (decks/<id>/log/<YYYY-MM-DD>), one line per answer ----------
   a line is "time|row|card type|answer 0-4|check r/c/f/n|seconds|stage before (0 = new)|row clicked instead" */
const p2 = n => String(n).padStart(2, '0');
const dayKey = (t, roll) => { const d = new Date(dayStart(t, roll)); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const logsOf = d => S.logs[d.id] || (S.logs[d.id] = new Map());
const logPath = (d, k) => 'decks/' + d.id + '/log/' + k;
const RES = {right: 'r', close: 'c', far: 'f', none: 'n'};
/* ---------- workload forecast: plays the coming days through with the real ladders, limits and caps ----------
   Each studied card gets an answer drawn from how that stage has gone so far (this deck's log, else all decks, else typical values).
   Several runs are averaged. A day's result per deck: different due cards studied, new cards, due cards held back by the cap, answers. */
const MIX_NEW = [0.45, 0.1, 0.15, 0.22, 0.08], MIX_REV = [0.08, 0.07, 0.15, 0.55, 0.15];

  const all = {}, per = {}, pool = [0, 0, 0, 0, 0], tot = a => a ? a[0] + a[1] + a[2] + a[3] + a[4] : 0; let sec = 0, n = 0;
  for(const d of allDecks()){ const m = per[d.id] = {}; for(const doc of logsOf(d).values()) for(const line of doc.e){ const a = line.split('|'), g = +a[3], st = +a[6] || 0; if(!(g >= 0 && g < 5)) continue;
    (m[st] || (m[st] = [0, 0, 0, 0, 0]))[g]++; (all[st] || (all[st] = [0, 0, 0, 0, 0]))[g]++; if(st) pool[g]++; sec += +a[5] || 0; n++; } }
  const f = (did, st) => { const a = per[did] && per[did][st]; if(tot(a) >= 15) return a; if(tot(all[st]) >= 15) return all[st]; if(st && tot(pool) >= 30) return pool; return st ? MIX_REV : MIX_NEW; };
  f.sec = n >= 20 ? sec / n : 8; f.n = n; return f;
}
let simC = null;
function simulate(days){
  const key = stateV + '|' + days + '|' + capOf() + '|' + newCapOf() + '|' + Object.keys(S.decks).length; if(simC && simC.key === key) return simC.r;
  const now = Date.now(), DAY = 86400000, RUNS = 5, ds = allDecks(), mix = answerMix(), cap = capOf(), newCap = newCapOf(), base = [], info = {}, out = {};

}

function mergeDecks(A, B){

async function mergeRun(){

}

/* map pointer handling: drag pans, two fingers pinch, a press that does not move is a click on the map */
const ptrs = new Map(); let drag = null;

  if(rm.classList.contains('gg')){ const a = document.elementsFromPoint(cx, cy).map(el => el.closest && el.closest('.gbg a[href]')).find(Boolean); if(a){ window.open(a.href, '_blank', 'noopener'); return; } }   // Google's own links under the shapes (terms, the logo) stay usable
